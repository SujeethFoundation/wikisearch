name: Build and deploy Python project to Azure Function App - wikisearch

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate required project files
        run: |
          test -f function_app.py
          test -f host.json
          test -f requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile function_app.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            function_app.py
            host.json
            requirements.txt
            !local.settings.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download project artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8E8FEF2AB9A9430A989246DD99B1F3BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_17DF82897EB84BC7AA00FA30BDB11A1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC4FEEA0792848B29249869A1176DAC6 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'wikisearch'
          package: '.'
          remote-build: true
